# Build the pacifica-obd documentation site with tools/build_site.py and deploy it
# to GitHub Pages. The Markdown in docs/ is the source of truth: this workflow
# only renders it into site/, which is uploaded as an artifact and never
# committed (the repository .gitignore is intentionally left untouched).
name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages: write` + `id-token: write` are required by the Pages deployment and are
# only consumed by the `deploy` job; `contents: read` is enough for the build.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and never cancel one that is already running:
# a cancelled Pages deployment can leave the environment reporting a failure.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      # The generator is strict about obvious breakage (missing templates, bad
      # tokens) and reports the pages it rendered; --out site keeps the artifact
      # path in one place. Build logs list any nav entry whose file is missing.
      - name: Build the site
        run: python tools/build_site.py --out site --verbose

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true  # enable Pages automatically if it is not yet enabled

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
