# MkDocs configuration for the pacifica-obd documentation site (GitHub Pages).
#
# The Markdown in docs/ is the single source of truth: nothing is generated by
# hand into the site, and the existing deep-dive documents are served as-is.
#
#   preview : uv run --with-requirements requirements-docs.txt mkdocs serve
#   build   : uv run --with-requirements requirements-docs.txt \
#               mkdocs build --strict --site-dir build/docs
#
# CI builds into site/ and deploys it (see .github/workflows/pages.yml). Locally,
# keep --site-dir inside the already-ignored build/ directory: the default site/
# is not ignored, and this repository's .gitignore must not change.

site_name: pacifica-obd
site_url: https://yorch.github.io/pacifica-obd/
site_description: >-
  OBD-II and UDS diagnostics toolkit for the 2021 Chrysler Pacifica via a
  vLinker FS adapter — VIN, DTCs, readiness, live data, read-only UDS
  module/DID discovery, and explicitly guarded write primitives, from the
  command line.
site_author: Jorge Barnaby
repo_url: https://github.com/yorch/pacifica-obd
repo_name: yorch/pacifica-obd
edit_uri: edit/main/docs/
copyright: MIT licensed · built with MkDocs Material

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.select
    - content.tabs.link
  palette:
    # Auto-detects the OS preference, then lets the reader toggle.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Command reference: usage.md
  - Technical reference: technical.md
  - Deep dives:
      - Chrysler Security Gateway: chrysler-sgw.md
      - Enhanced (AlfaOBD-class) diagnostics: enhanced-diagnostics.md
      - Vehicle support (RU family): vehicle-support.md
      - FCA modules (AlfaOBD database): fca-modules.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Two classes of link problem come from documents this site does not own, and
# MkDocs cannot resolve them either way:
#
#   * docs/vehicle-support.md and docs/fca-modules.md link into the source tree
#     (../AGENTS.md, ../src/pacifica_obd/*.py), which is outside docs_dir;
#   * those files are the source of truth for their own content, so the fix
#     belongs in them, not here.
#
# Both keep their messages visible at info level — `anchors` at MkDocs' own
# default, `not_found` lowered from warn — so `mkdocs build --strict` stays a
# useful gate for the pages this site owns: nav targets, unrecognized links,
# and every link/anchor in index/getting-started/usage/technical.md.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: info
    unrecognized_links: warn
    anchors: info

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yorch/pacifica-obd
      name: pacifica-obd on GitHub
