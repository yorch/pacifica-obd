[project]
name = "pacifica-obd"
version = "0.1.0"
description = "OBD-II diagnostics toolkit for the 2021 Chrysler Pacifica (vLinker FS + python-OBD)"
readme = "README.md"
authors = [
    { name = "Jorge Barnaby", email = "jorge.barnaby@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "obd>=0.7.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.optional-dependencies]
# The local web UI. Optional: the CLI/TUI work without it (`uv sync`); install
# the UI with `uv sync --extra web`. httpx is only needed by the standalone
# web-API tests (FastAPI's TestClient depends on it), not by the server itself.
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
pacifica-obd = "pacifica_obd:main"
pacifica-obd-web = "pacifica_obd.web.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
