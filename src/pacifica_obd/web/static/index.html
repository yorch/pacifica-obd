<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pacifica-obd · diagnostics</title>
<link rel="stylesheet" href="/vendor/uplot.min.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections">
    <div class="rail__brand">
      <span class="rail__mark" aria-hidden="true">PO</span>
      <span class="rail__title">pacifica-obd<small>read-only</small></span>
    </div>
    <div class="rail__groups" id="rail-groups"></div>
    <div class="rail__foot">
      <button class="btn btn--ghost btn--sm" id="theme-toggle" type="button">Theme</button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="topbar__menu" id="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
      <div class="topbar__conn">
        <span class="dot" id="conn-dot" data-state="idle" aria-hidden="true"></span>
        <span class="mono" id="conn-port">—</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="conn-proto">—</span>
        <span class="sep" aria-hidden="true">·</span>
        <span class="pill" id="conn-bus">can-c</span>
      </div>
      <div class="topbar__actions">
        <span class="pill pill--idle" id="lock-pill" hidden>adapter busy</span>
        <button class="btn btn--sm" id="connect-btn" type="button">Connect</button>
        <button class="btn btn--sm btn--danger" id="stop-btn" type="button" disabled>Stop</button>
      </div>
    </header>

    <div id="safety-banner" class="banners" role="status" aria-live="polite">
      <div class="banner banner--info">Read-only: this server can read the vehicle, unlock
        nothing and write nothing. The assistant can read; it cannot write.</div>
    </div>

    <div id="banners" class="banners" role="status" aria-live="polite"></div>

    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script src="/vendor/uplot.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
